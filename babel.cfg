[python: backend/**.py]

[python: imports/**.py]
[jinja2: frontend/templates/**.html]
extensions=jinja2.ext.i18n

# Babel ne descend pas dans les dossiers commençant par "_" : les macros
# (frontend/templates/_macros) sont passées en argument à part par
# tools/i18n.sh, et leurs chemins relatifs sont donc ceux de ce dossier.
[jinja2: *.html]
extensions=jinja2.ext.i18n
