services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finance}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The app only starts (and runs its migrations) once Postgres accepts
    # connections, see the app's depends_on.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No "ports:" here on purpose: Postgres must only be reachable from the
    # app container, on the internal Docker Compose network, never exposed
    # on the host.

  app:
    build: .
    restart: always
    ports:
      - "${PORT:-8181}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finance:${DB_PASSWORD:-finance}@db:5432/finance
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-changeme}
      # Living style guide at /design-system. Off by default: the route
      # returns 404 unless this variable is true.
      SHOW_DESIGN_SYSTEM: ${SHOW_DESIGN_SYSTEM:-false}

  # --- Tests (profile "test", left out of the normal start) ---
  # tools/test.sh: a throwaway PostgreSQL database (in memory, no volume) and
  # a Python container that runs the pytest suite against it.
  db-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance_test
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  test:
    profiles: ["test"]
    image: python:3.12-slim
    depends_on:
      db-test:
        condition: service_healthy
    working_dir: /work
    volumes:
      - .:/work:ro
    environment:
      DATABASE_URL: postgresql://finance:finance@db-test:5432/finance_test
      AUTH_ENABLED: "true"
      AUTH_PASSWORD: changeme
      SHOW_DESIGN_SYSTEM: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_ROOT_USER_ACTION: ignore
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    command: >
      sh -c "pip install -q -r requirements.txt -r requirements-dev.txt
      && python -m pytest -p no:cacheprovider"

volumes:
  pgdata:
