<div class="flex flex-col gap-2 w-full">
  <select
    name="category_id"
    required
    autofocus
    aria-label="{{ _("Choisir une catégorie...") }}"
    hx-get="/backlog/{{ transaction.id }}/category-confirm?page={{ page }}"
    hx-target="#backlog-confirm-{{ transaction.id }}"
    hx-swap="innerHTML"
    hx-trigger="change"
    class="input-base"
  >
    <option value="" disabled selected>{{ _("Choisir une catégorie...") }}</option>
    {% for parent in categories %}
    <optgroup label="{{ parent.icon or '' }} {{ parent.name }}">
      <option value="{{ parent.id }}">{% trans name=parent.name %}{{ name }} (général){% endtrans %}</option>
      {% for child in parent.children %}
      <option value="{{ child.id }}">{{ child.name }}</option>
      {% endfor %}
    </optgroup>
    {% endfor %}
  </select>
  <div id="backlog-confirm-{{ transaction.id }}"></div>
</div>
