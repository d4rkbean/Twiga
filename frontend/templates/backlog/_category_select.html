<div class="flex flex-col gap-2">
  <select
    name="category_id"
    required
    autofocus
    hx-get="/backlog/{{ transaction.id }}/category-confirm?page={{ page }}"
    hx-target="#backlog-confirm-{{ transaction.id }}"
    hx-swap="innerHTML"
    hx-trigger="change"
    class="w-full min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
  >
    <option value="" disabled selected>Choisir une catégorie...</option>
    {% for parent in categories %}
    <optgroup label="{{ parent.icon or '' }} {{ parent.name }}">
      <option value="{{ parent.id }}">{{ parent.name }} (général)</option>
      {% for child in parent.children %}
      <option value="{{ child.id }}">{{ child.name }}</option>
      {% endfor %}
    </optgroup>
    {% endfor %}
  </select>
  <div id="backlog-confirm-{{ transaction.id }}"></div>
</div>
