{% if show_le_cap_midmonth_banner %}
<div id="le-cap-midmonth-banner" class="w-full flex items-center gap-2 bg-container rounded-xl shadow-sm py-2 pl-4 pr-2">
  <p class="text-sm text-primary flex-1 flex items-center gap-2">{{ icon('calendar-event') }} {{ _("Mi-mois — Le cap tient-il ?") }}</p>
  <a href="/cap/mid" class="btn btn-secondary flex-shrink-0 px-3">
    {{ _("Vérifier") }} {{ icon('arrow-narrow-right') }}
  </a>
  <button type="button" id="le-cap-midmonth-banner-close" aria-label="{{ _("Fermer") }}" class="btn btn-ghost w-[50px] px-0 text-secondary flex-shrink-0">
    {{ icon('x') }}
  </button>
</div>
<script>
  (function () {
    var key = "dismissed_le_cap_midmonth_banner_" + {{ current_month_key | tojson | safe }};
    var banner = document.getElementById("le-cap-midmonth-banner");
    if (!banner) return;
    if (localStorage.getItem(key) === "true") {
      banner.remove();
      return;
    }
    document.getElementById("le-cap-midmonth-banner-close").addEventListener("click", function () {
      localStorage.setItem(key, "true");
      banner.remove();
    });
  })();
</script>
{% endif %}
