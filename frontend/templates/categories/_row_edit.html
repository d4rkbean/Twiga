<form
  id="category-row-{{ category.id }}"
  hx-post="/categories/{{ category.id }}/update"
  hx-target="#categories-content"
  hx-swap="outerHTML"
  class="px-4 lg:px-6 py-3 border-t border-border bg-sunken/50 {{ 'pl-8 lg:pl-14' if is_child else '' }} flex flex-col gap-2 lg:flex-row lg:items-center"
>
  <input
    type="text"
    name="name"
    value="{{ category.name }}"
    aria-label="{{ _("Nom de la catégorie") }}"
    required
    autofocus
    class="input-base lg:flex-1"
  />
  <div class="flex gap-2">
    <button type="submit" class="btn btn-primary flex-1 lg:flex-none lg:px-8">
      {{ _("Enregistrer") }}
    </button>
    <button
      type="button"
      hx-get="/categories/{{ category.id }}/row?is_child={{ 'true' if is_child else 'false' }}"
      hx-target="#category-row-{{ category.id }}"
      hx-swap="outerHTML"
      class="btn btn-secondary border-border-strong flex-1 lg:flex-none lg:px-8"
    >
      {{ _("Annuler") }}
    </button>
  </div>
</form>
