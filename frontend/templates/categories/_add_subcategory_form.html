<form
  id="add-subcategory-{{ parent.id }}"
  hx-post="/categories/create"
  hx-target="#categories-content"
  hx-swap="outerHTML"
  class="pl-6 flex flex-col gap-2"
>
  <input type="hidden" name="parent_id" value="{{ parent.id }}" />
  <input
    type="text"
    name="name"
    placeholder="Nom de la sous-catégorie"
    required
    autofocus
    class="min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
  />
  <div class="flex gap-2">
    <button type="submit" class="flex-1 min-h-[50px] rounded-xl bg-accent text-on-accent font-semibold">
      Ajouter
    </button>
    <button
      type="button"
      hx-get="/categories/{{ parent.id }}/add-subcategory-button"
      hx-target="#add-subcategory-{{ parent.id }}"
      hx-swap="outerHTML"
      class="flex-1 min-h-[50px] rounded-xl bg-container border border-border text-primary font-medium"
    >
      Annuler
    </button>
  </div>
</form>
