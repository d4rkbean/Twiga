<form
  id="add-subcategory-{{ parent.id }}"
  hx-post="/categories/create"
  hx-target="#categories-content"
  hx-swap="outerHTML"
  class="px-4 lg:px-6 pl-8 lg:pl-14 py-3 border-t border-border bg-sunken/30 flex flex-col gap-2 lg:flex-row"
>
  <input type="hidden" name="parent_id" value="{{ parent.id }}" />
  <input
    type="text"
    name="name"
    placeholder="{{ _("Nom de la sous-catégorie") }}"
    aria-label="{{ _("Nom de la sous-catégorie") }}"
    required
    autofocus
    class="input-base lg:max-w-sm"
  />
  <div class="flex gap-2">
    <button type="submit" class="btn btn-primary flex-1 lg:flex-none lg:px-8">
      {{ _("Ajouter") }}
    </button>
    <button
      type="button"
      hx-get="/categories/{{ parent.id }}/add-subcategory-button"
      hx-target="#add-subcategory-{{ parent.id }}"
      hx-swap="outerHTML"
      class="btn btn-secondary border-border-strong flex-1 lg:flex-none lg:px-8"
    >
      {{ _("Annuler") }}
    </button>
  </div>
</form>
