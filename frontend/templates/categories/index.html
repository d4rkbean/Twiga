{% extends "base.html" %}

{% block title %}Catégories — Twiga 🦒{% endblock %}

{% block content %}
<main class="flex flex-col gap-4 px-4 pb-8 max-w-lg mx-auto">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-primary">Catégories</h1>
    <a href="/settings" class="text-sm text-accent font-medium">{{ icon('arrow-narrow-left') }} Paramètres</a>
  </div>

  <div class="bg-container rounded-xl shadow-sm p-4 md:p-6 flex flex-col gap-3">
    <h2 class="text-lg font-bold text-primary">Ajouter une catégorie</h2>
    <form
      hx-post="/categories/create"
      hx-target="#categories-content"
      hx-swap="outerHTML"
      class="flex flex-col gap-3"
    >
      <input
        type="text"
        name="name"
        placeholder="Nom de la catégorie"
        required
        class="min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
      />
      <select name="parent_id" class="min-h-[50px] rounded-xl border border-border bg-container text-primary px-3">
        <option value="">Catégorie de premier niveau</option>
        {% for parent in categories %}
        <option value="{{ parent.id }}">Sous-catégorie de {{ parent.icon or "" }} {{ parent.name }}</option>
        {% endfor %}
      </select>
      <button type="submit" class="min-h-[50px] rounded-xl bg-accent text-on-accent font-semibold">
        Ajouter
      </button>
    </form>
  </div>

  <div class="flex items-center justify-between">
    <h2 class="text-lg font-bold text-primary">Catégories existantes</h2>
    <button
      type="button"
      hx-post="/categories/reset-pillar-overrides"
      hx-target="#categories-content"
      hx-swap="outerHTML"
      hx-confirm="Réinitialiser tous les piliers des sous-catégories vers « hérite du parent » ?"
      class="text-xs text-secondary font-medium"
    >
      Réinitialiser les piliers
    </button>
  </div>
  {% include "categories/_content.html" %}
</main>
{% endblock %}
