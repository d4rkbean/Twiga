{% if show_le_cap_banner %}
<section id="le-cap-banner" aria-label="{{ _("Le Cap") }}" class="flex flex-wrap items-center gap-x-4 gap-y-3 bg-container rounded-xl border border-border shadow-sm px-4 py-3 lg:px-5">
  <span class="text-secondary flex-shrink-0">{{ icon('compass', size=22) }}</span>
  <p class="flex-1 basis-[240px] text-sm text-primary">{{ _("Un nouveau mois commence — Fixez le cap ensemble !") }}</p>
  <a href="/cap" class="btn btn-secondary flex-shrink-0">
    {{ _("Le Cap") }} {{ icon('arrow-right', size=16) }}
  </a>
  <button type="button" id="le-cap-banner-close" aria-label="{{ _("Fermer") }}" class="text-secondary flex-shrink-0 w-[50px] h-[50px] flex items-center justify-center">
    {{ icon('x') }}
  </button>
</section>
<script>
  (function () {
    var key = "dismissed_le_cap_banner_" + {{ current_month_key | tojson | safe }};
    var banner = document.getElementById("le-cap-banner");
    if (!banner) return;
    if (localStorage.getItem(key) === "true") {
      banner.remove();
      return;
    }
    document.getElementById("le-cap-banner-close").addEventListener("click", function () {
      localStorage.setItem(key, "true");
      banner.remove();
    });
  })();
</script>
{% endif %}
