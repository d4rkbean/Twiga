<form
  id="rule-row-{{ rule.id }}"
  hx-post="/rules/{{ rule.id }}/update"
  hx-target="#rules-content"
  hx-swap="outerHTML"
  class="border-t border-border bg-sunken/50 px-4 lg:px-6 py-4 flex flex-col gap-3"
>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
    <label class="form-group">
      <span class="form-label">{{ _("Mot-clé (ex : CARREFOUR)") }}</span>
      <input type="text" name="keyword" value="{{ rule.keyword }}" required class="input-base" />
    </label>
    <label class="form-group">
      <span class="form-label">{{ _("Catégorie") }}</span>
      <select
        name="parent_category_id"
        required
        hx-get="/transactions/subcategories?field_name=category_id&element_id=edit-rule-subcategory-{{ rule.id }}&allow_empty=false"
        hx-target="#edit-rule-subcategory-{{ rule.id }}"
        hx-swap="outerHTML"
        hx-trigger="change"
        class="input-base"
      >
        <option value="" disabled>{{ _("Choisir une catégorie...") }}</option>
        {% for category in parent_categories %}
        <option value="{{ category.id }}" {% if category.id == current_parent_id %}selected{% endif %}>
          {{ category.icon or "" }} {{ category.name }}
        </option>
        {% endfor %}
      </select>
    </label>
    <div class="form-group">
      <span class="form-label">{{ _("Sous-catégorie") }}</span>
      {% with field_name = "category_id", element_id = "edit-rule-subcategory-" ~ rule.id, allow_empty = false %}
      {% include "transactions/_subcategory_select.html" %}
      {% endwith %}
    </div>
    <label class="form-group">
      <span class="form-label">{{ _("Mode de paiement (optionnel)") }}</span>
      <select name="payment_method" class="input-base">
        <option value="" {% if not rule.payment_method %}selected{% endif %}>{{ _("Mode de paiement (optionnel)") }}</option>
        {% for code, meta in payment_methods.items() %}
        <option value="{{ code }}" {% if rule.payment_method == code %}selected{% endif %}>{{ meta.label }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <label class="form-group">
    <span class="form-label">{{ _("Rayon de ticket auto (optionnel)") }}</span>
    <select name="receipt_family" class="input-base lg:max-w-sm">
      <option value="" {% if not rule.receipt_family %}selected{% endif %}>{{ _("Rayon de ticket auto (optionnel)") }}</option>
      {% for code, family_icon, label in receipt_families %}
      <option value="{{ code }}" {% if rule.receipt_family == code %}selected{% endif %}>{{ family_icon }} {{ label }}</option>
      {% endfor %}
    </select>
    <span class="input-hint">
      {{ _("Pour un commerce à famille de produit unique (boulangerie...) : ajoute automatiquement une ligne de ticket couvrant tout le montant — uniquement pris en compte si la catégorie choisie ci-dessus est Courses.") }}
    </span>
  </label>
  <div class="flex gap-2">
    <button type="submit" class="btn btn-primary flex-1 lg:flex-none lg:px-8">
      {{ _("Enregistrer") }}
    </button>
    <button
      type="button"
      hx-get="/rules/{{ rule.id }}/row"
      hx-target="#rule-row-{{ rule.id }}"
      hx-swap="outerHTML"
      class="btn btn-secondary border-border-strong flex-1 lg:flex-none lg:px-8"
    >
      {{ _("Annuler") }}
    </button>
  </div>
</form>
