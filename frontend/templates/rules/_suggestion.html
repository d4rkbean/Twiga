<div id="suggestion-{{ suggestion.id }}" class="flex flex-col gap-3 px-4 lg:px-6 py-3 border-t border-border lg:flex-row lg:items-center lg:gap-4">
  <p class="text-sm text-primary min-w-0 flex-1">
    {{ _("Si le libellé contient") }}
    <span class="font-semibold">« {{ suggestion.keyword }} »</span>
    <span class="inline-block align-middle text-secondary">{{ icon('arrow-narrow-right', size=16) }}</span>
    <span class="font-semibold">{{ suggestion.category.name | category_display }}</span>
    {% if suggestion.occurrences > 1 %}
    <span class="text-xs text-secondary">{% trans occurrences=suggestion.occurrences %}— proposée {{ occurrences }} fois{% endtrans %}</span>
    {% endif %}
  </p>
  <div class="flex gap-2 flex-shrink-0">
    <form hx-post="/rules/create" hx-target="#rules-content" hx-swap="outerHTML" class="flex-1">
      <input type="hidden" name="keyword" value="{{ suggestion.keyword }}" />
      <input type="hidden" name="category_id" value="{{ suggestion.category_id }}" />
      <button type="submit" class="btn btn-secondary border-border-strong w-full">
        {{ icon('check', size=16) }} {{ _("Créer") }}
      </button>
    </form>
    <button
      type="button"
      hx-get="/rules/suggestions/{{ suggestion.id }}/edit"
      hx-target="#suggestion-{{ suggestion.id }}"
      hx-swap="outerHTML"
      aria-label="{{ _("Modifier") }}"
      class="btn btn-secondary border-border-strong w-[50px] px-0"
    >
      {{ icon('pencil', size=18) }}
    </button>
    <button
      type="button"
      hx-post="/rules/suggestions/{{ suggestion.id }}/dismiss"
      hx-target="#rules-content"
      hx-swap="outerHTML"
      class="btn btn-ghost text-secondary flex-1"
    >
      {{ icon('x', size=16) }} {{ _("Ignorer") }}
    </button>
  </div>
</div>
