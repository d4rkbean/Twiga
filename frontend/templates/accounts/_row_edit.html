<form
  id="account-row-{{ account.id }}"
  hx-post="/accounts/{{ account.id }}/update"
  hx-target="#accounts-content"
  hx-swap="outerHTML"
  class="border-t border-border bg-sunken/50 px-4 lg:px-6 py-4 flex flex-col gap-3"
>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
    <label class="form-group">
      <span class="form-label">{{ _("Nom du compte") }}</span>
      <input type="text" name="name" value="{{ account.name }}" required autofocus class="input-base" />
    </label>
    <label class="form-group">
      <span class="form-label">{{ _("Type") }}</span>
      <select name="type" class="input-base">
        {% for code, meta in account_types.items() %}
        <option value="{{ code }}" {% if account.type == code %}selected{% endif %}>{{ meta.label }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="form-group">
      <span class="form-label">{{ _("Solde initial (avant la 1ère opération importée)") }}</span>
      <input type="text" inputmode="decimal" name="initial_balance" value="{{ account.balance }}" class="input-base" />
    </label>
    <label class="flex items-center justify-between gap-2 min-h-[50px] lg:self-end">
      <span class="text-sm text-primary">{{ _("Couleur") }}</span>
      <input
        type="color"
        name="color"
        value="{{ account | account_color }}"
        class="h-[50px] w-16 rounded-xl border border-field bg-container"
      />
    </label>
  </div>
  <label class="form-group">
    <span class="form-label">{{ _("Notes (optionnel)") }}</span>
    <textarea name="notes" rows="2" class="input-base py-3">{{ account.notes or "" }}</textarea>
  </label>
  <div class="flex gap-2">
    <button type="submit" class="btn btn-primary flex-1 lg:flex-none lg:px-8">
      {{ _("Enregistrer") }}
    </button>
    <button
      type="button"
      hx-get="/accounts/{{ account.id }}/row"
      hx-target="#account-row-{{ account.id }}"
      hx-swap="outerHTML"
      class="btn btn-secondary border-border-strong flex-1 lg:flex-none lg:px-8"
    >
      {{ _("Annuler") }}
    </button>
  </div>
</form>
