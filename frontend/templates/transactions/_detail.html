<form
  hx-post="/transactions/{{ transaction.id }}/update?{{ filter_qs }}"
  hx-target="#transactions-content"
  hx-swap="innerHTML"
  hx-on:htmx:after-request="if(event.target === this && event.detail.successful) document.getElementById('transaction-detail-dialog').close()"
  class="flex flex-col gap-4 p-6"
>
  <h2 class="text-xl font-bold text-primary">{{ _("Modifier l'opération") }}</h2>

  <div class="flex flex-col gap-2 rounded-xl border-2 border-accent p-3">
    <label class="flex flex-col gap-1">
      <span class="text-sm font-semibold text-accent flex items-center gap-1" >{{ icon('edit', size=16) }}{{ _("Libellé simplifié") }}</span>
      <input
        type="text"
        name="label"
        required
        value="{{ transaction.label }}"
        class="text-lg font-medium min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
      />
    </label>
    {% if transaction.raw_label != transaction.label %}
    <p class="text-xs text-secondary break-words">{% trans raw_label=transaction.raw_label %}Libellé brut : {{ raw_label }}{% endtrans %}</p>
    {% endif %}
  </div>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary">{{ _("Catégorie") }}</span>
    <select
      name="parent_category_id"
      hx-get="/transactions/subcategories"
      hx-target="#subcategory-select"
      hx-swap="outerHTML"
      hx-trigger="change"
      class="min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
    >
      <option value="">{{ _("Non catégorisé") }}</option>
      {% for category in parent_categories %}
      <option value="{{ category.id }}" {% if category.id == current_parent_id %}selected{% endif %}>
        {{ category.icon or "" }} {{ category.name }}
      </option>
      {% endfor %}
    </select>
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary">{{ _("Sous-catégorie") }}</span>
    {% include "transactions/_subcategory_select.html" %}
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary">{{ _("Mode de paiement") }}</span>
    <select
      name="payment_method"
      class="min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
    >
      <option value="" {% if not transaction.payment_method %}selected{% endif %}>{{ _("— (non défini)") }}</option>
      {% for code, meta in payment_methods.items() %}
      <option value="{{ code }}" {% if transaction.payment_method == code %}selected{% endif %}>
        {{ meta.icon }} {{ meta.label }}
      </option>
      {% endfor %}
    </select>
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary">{{ _("Compte") }}</span>
    <select
      name="account_id"
      required
      class="min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
    >
      {% for account in accounts %}
      <option value="{{ account.id }}" {% if account.id == transaction.account_id %}selected{% endif %}>
        {{ account.name }}
      </option>
      {% endfor %}
    </select>
  </label>

  <label class="flex items-center gap-2 min-h-[50px]">
    <input
      type="checkbox"
      name="is_transfer"
      {% if transaction.is_transfer %}checked{% endif %}
      class="w-5 h-5"
    />
    <span class="text-sm text-primary flex items-center gap-1" >{{ icon('repeat', size=16) }}{{ _("Virement interne entre comptes") }}</span>
  </label>

  <label class="flex items-center gap-2 min-h-[50px]">
    <input
      type="checkbox"
      name="is_unexpected"
      {% if transaction.is_unexpected %}checked{% endif %}
      class="w-5 h-5"
    />
    <span class="text-sm text-primary flex items-center gap-1" >{{ icon('urgent', size=16) }}{{ _("Dépense imprévue") }}</span>
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary">{{ _("Montant") }}</span>
    <div class="flex gap-2">
      <button
        type="button"
        aria-label="{{ _("Inverser le signe (dépense / recette)") }}"
        onclick="var i=this.nextElementSibling; var v=i.value.trim(); i.value = v.startsWith('-') ? v.slice(1) : ('-' + v); i.focus();"
        class="min-h-[50px] w-14 flex-shrink-0 rounded-xl border border-border bg-container text-primary text-2xl font-bold"
      >
        ±
      </button>
      <input
        type="text"
        inputmode="decimal"
        name="amount"
        required
        value="{{ '%.2f' % transaction.amount }}"
        class="flex-1 min-w-0 min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
      />
    </div>
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary">{{ _("Date") }}</span>
    <input
      type="date"
      name="date"
      required
      value="{{ transaction.date.isoformat() }}"
      class="min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
    />
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary flex items-center gap-1" >{{ icon('note', size=16) }}{{ _("Note") }}</span>
    <textarea
      name="note"
      rows="2"
      placeholder="{{ _("Remboursement Pierre...") }}"
      class="rounded-xl border border-border bg-container text-primary px-3 py-2"
    >{{ transaction.note or "" }}</textarea>
  </label>

  <div class="flex flex-col gap-2">
    <button type="submit" class="min-h-[50px] rounded-xl bg-accent text-on-accent font-semibold">
      {{ _("Enregistrer") }}
    </button>
    <button
      type="button"
      onclick="this.closest('dialog').close()"
      class="min-h-[50px] rounded-xl bg-container border border-border text-primary font-medium"
    >
      {{ _("Annuler") }}
    </button>
  </div>
</form>

<div class="px-6">
  {% include "transactions/_receipt.html" %}
</div>

{% if transaction.validated %}
<form
  hx-post="/transactions/{{ transaction.id }}/unvalidate?{{ filter_qs }}"
  hx-target="#transactions-content"
  hx-swap="innerHTML"
  hx-on:htmx:after-request="if(event.detail.successful) document.getElementById('transaction-detail-dialog').close()"
  class="px-6"
>
  <button
    type="submit"
    class="min-h-[50px] rounded-xl bg-container border border-border text-primary font-medium w-full"
  >
    {{ icon('arrow-back-up') }} {{ _("Remettre dans La Savane (non validée)") }}
  </button>
</form>
{% endif %}

<form
  hx-post="/transactions/{{ transaction.id }}/delete?{{ filter_qs }}"
  hx-target="#transactions-content"
  hx-swap="innerHTML"
  hx-confirm="{{ _("Supprimer définitivement cette opération ?") }}"
  hx-on:htmx:after-request="if(event.detail.successful) document.getElementById('transaction-detail-dialog').close()"
  class="px-6 pb-6 pt-2"
>
  <button type="submit" class="min-h-[50px] rounded-xl text-danger font-medium w-full">
    {{ icon('trash') }} {{ _("Supprimer cette transaction") }}
  </button>
</form>
