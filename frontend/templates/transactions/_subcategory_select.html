<select
  id="{{ element_id }}"
  name="{{ field_name }}"
  class="w-full min-h-[50px] rounded-xl border border-border bg-container text-primary px-3 disabled:opacity-50 disabled:text-secondary"
  {% if not parent %}disabled{% endif %}
>
  {% if parent %}
    {% if allow_empty %}
    <option value="" {% if not selected_category_id %}selected{% endif %}>{{ _("Toutes les sous-catégories") }}</option>
    {% endif %}
    <option value="{{ parent.id }}" {% if selected_category_id == parent.id %}selected{% endif %}>
      {% trans name=parent.name %}— {{ name }} (sans sous-catégorie){% endtrans %}
    </option>
    {% for sub in subcategories %}
    <option value="{{ sub.id }}" {% if selected_category_id == sub.id %}selected{% endif %}>
      {{ sub.icon or "" }} {{ sub.name }}
    </option>
    {% endfor %}
  {% else %}
  <option value="">—</option>
  {% endif %}
</select>
