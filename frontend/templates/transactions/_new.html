<form
  hx-post="/transactions/create?{{ filter_qs }}"
  hx-target="#transactions-content"
  hx-swap="innerHTML"
  hx-on:htmx:after-request="if(event.target === this && event.detail.successful) document.getElementById('transaction-detail-dialog').close()"
  class="flex flex-col gap-4 p-6"
>
  <h2 class="text-xl font-bold text-primary">Nouvelle opération</h2>
  <p class="text-sm text-secondary -mt-2">
    Pour une saisie manuelle : régularisation, achat en espèces, etc.
  </p>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary">Libellé</span>
    <input
      type="text"
      name="label"
      required
      autofocus
      placeholder="Ex : Régularisation, Achat en espèces..."
      class="text-lg font-medium min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
    />
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary">Catégorie</span>
    <select
      name="parent_category_id"
      hx-get="/transactions/subcategories"
      hx-target="#subcategory-select"
      hx-swap="outerHTML"
      hx-trigger="change"
      class="min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
    >
      <option value="" selected>Non catégorisé</option>
      {% for category in parent_categories %}
      <option value="{{ category.id }}">{{ category.icon or "" }} {{ category.name }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary">Sous-catégorie</span>
    {% include "transactions/_subcategory_select.html" %}
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary">Mode de paiement</span>
    <select
      name="payment_method"
      class="min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
    >
      <option value="" selected>— (non défini)</option>
      {% for code, meta in payment_methods.items() %}
      <option value="{{ code }}">{{ meta.icon }} {{ meta.label }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary">Compte</span>
    <select
      name="account_id"
      required
      class="min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
    >
      {% for account in accounts %}
      <option value="{{ account.id }}">{{ account.name }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="flex items-center gap-2 min-h-[50px]">
    <input type="checkbox" name="is_transfer" class="w-5 h-5" />
    <span class="text-sm text-primary flex items-center gap-1" >{{ icon('repeat', size=16) }}Virement interne entre comptes</span>
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary">Montant</span>
    <div class="flex gap-2">
      <button
        type="button"
        aria-label="Inverser le signe (dépense / recette)"
        onclick="var i=this.nextElementSibling; var v=i.value.trim(); i.value = v.startsWith('-') ? v.slice(1) : ('-' + v); i.focus();"
        class="min-h-[50px] w-14 flex-shrink-0 rounded-xl border border-border bg-container text-primary text-2xl font-bold"
      >
        ±
      </button>
      <input
        type="text"
        inputmode="decimal"
        name="amount"
        required
        placeholder="42.50"
        class="flex-1 min-w-0 min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
      />
    </div>
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary">Date</span>
    <input
      type="date"
      name="date"
      required
      value="{{ today }}"
      class="min-h-[50px] rounded-xl border border-border bg-container text-primary px-3"
    />
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-sm text-secondary flex items-center gap-1" >{{ icon('note', size=16) }}Note</span>
    <textarea
      name="note"
      rows="2"
      placeholder="Remboursement Pierre..."
      class="rounded-xl border border-border bg-container text-primary px-3 py-2"
    ></textarea>
  </label>

  <div class="flex flex-col gap-2">
    <button type="submit" class="min-h-[50px] rounded-xl bg-accent text-on-accent font-semibold">
      Ajouter l'opération
    </button>
    <button
      type="button"
      onclick="this.closest('dialog').close()"
      class="min-h-[50px] rounded-xl bg-container border border-border text-primary font-medium"
    >
      Annuler
    </button>
  </div>
</form>
