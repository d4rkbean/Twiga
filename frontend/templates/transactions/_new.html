<form
  hx-post="/transactions/create?{{ filter_qs }}"
  hx-target="#transactions-content"
  hx-swap="innerHTML"
  hx-on:htmx:after-request="if(event.target === this && event.detail.successful) document.getElementById('transaction-detail-dialog').close()"
  class="flex flex-col gap-4 p-6"
>
  <div class="flex flex-col gap-1">
    <h2 class="text-section-title">{{ _("Nouvelle opération") }}</h2>
    <p class="text-sm text-secondary">
      {{ _("Pour une saisie manuelle : régularisation, achat en espèces, etc.") }}
    </p>
  </div>

  <label class="form-group">
    <span class="form-label">{{ _("Libellé") }}</span>
    <input
      type="text"
      name="label"
      required
      autofocus
      placeholder="{{ _("Ex : Régularisation, Achat en espèces...") }}"
      class="input-base text-base font-medium"
    />
  </label>

  <label class="form-group">
    <span class="form-label">{{ _("Montant") }}</span>
    <div class="flex gap-2">
      <button
        type="button"
        aria-label="{{ _("Inverser le signe (dépense / recette)") }}"
        onclick="var i=this.nextElementSibling; var v=i.value.trim(); i.value = v.startsWith('-') ? v.slice(1) : ('-' + v); i.focus();"
        class="btn btn-secondary w-14 flex-shrink-0 px-0 text-xl font-semibold"
      >
        ±
      </button>
      <input
        type="text"
        inputmode="decimal"
        name="amount"
        required
        placeholder="42.50"
        class="input-base flex-1 min-w-0 tabular-nums"
      />
    </div>
  </label>

  <label class="form-group">
    <span class="form-label">{{ _("Date") }}</span>
    <input
      type="date"
      name="date"
      required
      value="{{ today }}"
      class="input-base"
    />
  </label>

  <label class="form-group">
    <span class="form-label">{{ _("Catégorie") }}</span>
    <select
      name="parent_category_id"
      hx-get="/transactions/subcategories"
      hx-target="#subcategory-select"
      hx-swap="outerHTML"
      hx-trigger="change"
      class="input-base"
    >
      <option value="" selected>{{ _("Non catégorisé") }}</option>
      {% for category in parent_categories %}
      <option value="{{ category.id }}">{{ category.icon or "" }} {{ category.name }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="form-group">
    <span class="form-label">{{ _("Sous-catégorie") }}</span>
    {% include "transactions/_subcategory_select.html" %}
  </label>

  <label class="form-group">
    <span class="form-label">{{ _("Mode de paiement") }}</span>
    <select name="payment_method" class="input-base">
      <option value="" selected>{{ _("— (non défini)") }}</option>
      {% for code, meta in payment_methods.items() %}
      <option value="{{ code }}">{{ meta.icon }} {{ meta.label }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="form-group">
    <span class="form-label">{{ _("Compte") }}</span>
    <select name="account_id" required class="input-base">
      {% for account in accounts %}
      <option value="{{ account.id }}">{{ account.name }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="flex items-center gap-3 min-h-[50px] cursor-pointer">
    <input type="checkbox" name="is_transfer" class="w-5 h-5" />
    <span class="text-sm text-primary flex items-center gap-1.5">{{ icon('repeat', size=16) }}{{ _("Virement interne entre comptes") }}</span>
  </label>

  <label class="form-group">
    <span class="form-label flex items-center gap-1">{{ icon('note', size=14) }}{{ _("Note") }}</span>
    <textarea
      name="note"
      rows="2"
      placeholder="{{ _("Remboursement Pierre...") }}"
      class="input-base py-2"
    ></textarea>
  </label>

  <div class="flex flex-col gap-2">
    <button type="submit" class="btn btn-primary">
      {{ _("Ajouter l'opération") }}
    </button>
    <button
      type="button"
      onclick="this.closest('dialog').close()"
      class="btn btn-secondary"
    >
      {{ _("Annuler") }}
    </button>
  </div>
</form>
