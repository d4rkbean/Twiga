<div class="bg-container rounded-xl shadow-sm p-6 flex flex-col gap-4">
  <h2 class="text-xl font-bold text-primary">Étape 2 — Aperçu des opérations</h2>
  <p class="text-sm text-secondary">{{ total_count }} opération(s) détectée(s) dans le fichier OFX.</p>

  <div class="overflow-x-auto overflow-y-auto max-h-64 rounded-xl border border-border">
    <table class="w-full text-sm">
      <thead>
        <tr class="bg-page">
          <th class="text-left text-secondary font-medium px-3 py-2">Date</th>
          <th class="text-left text-secondary font-medium px-3 py-2">Libellé</th>
          <th class="text-right text-secondary font-medium px-3 py-2">Montant</th>
        </tr>
      </thead>
      <tbody>
        {% for tx in transactions %}
        <tr class="border-t border-border">
          <td class="text-primary px-3 py-2 whitespace-nowrap">{{ tx.date | fr_date }}</td>
          <td class="text-primary px-3 py-2">{{ tx.label }}</td>
          <td class="{{ 'text-success' if tx.amount > 0 else 'text-danger' }} font-medium px-3 py-2 text-right whitespace-nowrap">{{ tx.amount | eur }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <form hx-post="/imports/{{ import_id }}/confirm" hx-target="#import-wizard" hx-swap="innerHTML">
    <input type="hidden" name="format" value="ofx" />
    <input type="hidden" name="account_id" value="{{ account.id }}" />
    <button type="submit" class="min-h-[50px] rounded-xl bg-accent text-on-accent font-semibold w-full">
      Continuer
    </button>
  </form>
</div>
